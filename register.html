<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="register.css">
    <script src="auth.js" defer></script>
    <title>Trip It</title>
</head>
<body>
    <div class="container">
        <div class="reg-container">
           <form id="register-form">
                <h2>Register</h2>
                <input type="text" name="Username" placeholder="Username" required>
                <input type="email" name="Email" placeholder="Email" required>
                <input type="password" name="Parola" placeholder="Introdu parola" minlength="5" maxlength="40" required>
                <input type="password" name="Confirma parola" placeholder="Confirma parola" minlength="5" maxlength="40" required>
                <button class="btn" type="submit">Register</button>
                <span class="login-link">Ai deja cont? <a href="login.html">Login</a></span>
            </form>
        </div>
    </div>
</body>
</html>
